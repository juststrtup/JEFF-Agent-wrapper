<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeff</title>
<style>
  :root{
    --jeff-base-scene: url("/ui-assets/images/scenes/general-b59940f6e3.webp");
    --jeff-theme-scene: none;
    --panel:#000;
    --line:#1a0505;
    --line-hot:#3d0a0a;
    --red:#ff2233;
    --red-dim:#8c1620;
    --txt:#ffffff;
    --txt-dim:#9a9a9a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'SF Mono',ui-monospace,Menlo,monospace;
    color:var(--txt); display:flex; justify-content:center;
    overflow:hidden; position:relative; background:#05070c;
  }
  .aurora{
    position:absolute; left:-14%; top:-14%; width:128%; height:128%;
    z-index:0; pointer-events:none;
    background-image:var(--jeff-base-scene, none);
    background-size:cover; background-position:center;
    background-repeat:no-repeat;
    animation:drift 40s ease-in-out infinite alternate;
    transition:opacity 1.4s ease;
  }
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(1) rotate(0deg);}
    50%{transform:translate3d(-3%,2%,0) scale(1.08) rotate(4deg);}
    100%{transform:translate3d(3%,-2%,0) scale(1.04) rotate(-3deg);}
  }
  .flow, .gloss{
    position:absolute; left:-16%; top:-16%; width:132%; height:132%;
    z-index:0; pointer-events:none;
    background-image:var(--jeff-base-scene, none);
    background-size:cover; background-position:center;
    background-repeat:no-repeat;
    transition:opacity 1.4s ease;
  }
  .aurora-r, .flow-r, .gloss-r, .aurora-c, .flow-c, .gloss-c, .aurora-b, .flow-b, .gloss-b, .aurora-k, .flow-k, .gloss-k, .aurora-f, .flow-f, .gloss-f{
    position:absolute; z-index:0; pointer-events:none;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    opacity:0; transition:opacity 1.4s ease;
  }
  .aurora-r, .flow-r, .gloss-r{background-image:var(--jeff-theme-scene, none);}
  .aurora-c, .flow-c, .gloss-c{background-image:var(--jeff-theme-scene, none);}
  .aurora-b, .flow-b, .gloss-b{background-image:var(--jeff-theme-scene, none);}
  .aurora-k, .flow-k, .gloss-k{background-image:var(--jeff-theme-scene, none);}
  .aurora-f, .flow-f, .gloss-f{background-image:var(--jeff-theme-scene, none);}
  .aurora-r, .aurora-c, .aurora-b, .aurora-k, .aurora-f{
    left:-14%; top:-14%; width:128%; height:128%;
    animation:drift 40s ease-in-out infinite alternate;
  }
  .flow-r, .flow-c, .flow-b, .flow-k, .flow-f{
    left:-16%; top:-16%; width:132%; height:132%;
    mix-blend-mode:soft-light;
    animation:driftB 54s ease-in-out infinite alternate;
  }
  .gloss-r, .gloss-c, .gloss-b, .gloss-k, .gloss-f{
    left:-16%; top:-16%; width:132%; height:132%;
    mix-blend-mode:screen; filter:blur(14px); transform:scaleX(-1);
    animation:driftC 76s ease-in-out infinite alternate;
  }
  .app.investor .aurora, .app.investor .flow, .app.investor .gloss,
  .app.customer .aurora, .app.customer .flow, .app.customer .gloss,
  .app.business .aurora, .app.business .flow, .app.business .gloss,
  .app.campaign .aurora, .app.campaign .flow, .app.campaign .gloss,
  .app.financial .aurora, .app.financial .flow, .app.financial .gloss{opacity:0;}
  .app.investor .aurora-r{opacity:1;}
  .app.investor .flow-r{opacity:.6;}
  .app.investor .gloss-r{opacity:.30;}
  .app.customer .aurora-c{opacity:1;}
  .app.customer .flow-c{opacity:.55;}
  .app.customer .gloss-c{opacity:.26;}
  .app.business .aurora-b{opacity:1;}
  .app.business .flow-b{opacity:.5;}
  .app.business .gloss-b{opacity:.2;}
  .app.campaign .aurora-k{opacity:1;}
  .app.campaign .flow-k{opacity:.5;}
  .app.campaign .gloss-k{opacity:.2;}
  .app.financial .aurora-f{opacity:1;}
  .app.financial .flow-f{opacity:.5;}
  .app.financial .gloss-f{opacity:.22;}
  .app.business{border-color:rgba(198,150,32,.6);}
  .app.business .stat .fill{background:linear-gradient(90deg,#7a5a0c,#e0b23c);
    box-shadow:0 0 8px rgba(224,178,60,.5);}
  .app.business .stat.vision .fill{background:linear-gradient(90deg,#6b4e10,#f0d27a);}
  .app.business .msg.agent .body{border-left-color:#e0b23c;}
  .app.business .msg .tag{color:#6b5210; text-shadow:0 1px 5px rgba(255,255,255,.6);}
  .app.business .msg.user .tag{color:#4d4d4d;}
  .app.business .sys{color:#6b5210; background:rgba(255,255,255,.75);}
  .app.business .statsHead .chev, .app.business .stat.open .chev{color:#c69620;}
  .app.business .send{border-color:#c69620; color:#6b5210;}
  .app.business .send:hover{background:rgba(224,178,60,.18); box-shadow:0 0 12px rgba(224,178,60,.3);}
  .app.business .dot{background:#e0b23c; box-shadow:0 0 6px #e0b23c;}

  .app.campaign{border-color:rgba(240,130,40,.6);}
  .app.campaign .stat .fill{background:linear-gradient(90deg,#8c3d06,#ff8c3a);
    box-shadow:0 0 8px rgba(255,140,58,.5);}
  .app.campaign .stat.vision .fill{background:linear-gradient(90deg,#8a5210,#ffc078);}
  .app.campaign .msg.agent .body{border-left-color:#ff8c3a;}
  .app.campaign .msg .tag{color:#8c3d06; text-shadow:0 1px 5px rgba(255,255,255,.6);}
  .app.campaign .msg.user .tag{color:#4d4d4d;}
  .app.campaign .sys{color:#8c3d06; background:rgba(255,255,255,.75);}
  .app.campaign .statsHead .chev, .app.campaign .stat.open .chev{color:#f07a1e;}
  .app.campaign .send{border-color:#f07a1e; color:#8c3d06;}
  .app.campaign .send:hover{background:rgba(255,140,58,.18); box-shadow:0 0 12px rgba(255,140,58,.3);}
  .app.campaign .dot{background:#ff8c3a; box-shadow:0 0 6px #ff8c3a;}

  .app.financial{border-color:rgba(150,220,60,.6);}
  .app.financial .stat .fill{background:linear-gradient(90deg,#1c6b33,#a8e33a);
    box-shadow:0 0 8px rgba(168,227,58,.5);}
  .app.financial .stat.vision .fill{background:linear-gradient(90deg,#14572c,#d6f26a);}
  .app.financial .msg.agent .body{border-left-color:#a8e33a;}
  .app.financial .msg .tag{color:#12421f; text-shadow:0 1px 5px rgba(255,255,255,.5);}
  .app.financial .msg.user .tag{color:#16341c;}
  .app.financial .sys{color:#12421f; background:rgba(255,255,255,.75);}
  .app.financial .statsHead .chev, .app.financial .stat.open .chev{color:#a8e33a;}
  .app.financial .send{border-color:#a8e33a; color:#12421f;}
  .app.financial .send:hover{background:rgba(168,227,58,.2); box-shadow:0 0 12px rgba(168,227,58,.3);}
  .app.financial .dot{background:#a8e33a; box-shadow:0 0 6px #a8e33a;}
  .app.investor{border-color:rgba(255,34,51,.7);}
  .app.customer{border-color:rgba(90,220,190,.55);}
  .app.customer .stat .fill{background:linear-gradient(90deg,#0f6b58,#39e0b0);
    box-shadow:0 0 8px rgba(57,224,176,.5);}
  .app.customer .stat.vision .fill{background:linear-gradient(90deg,#0d5f74,#4fd6ee);}
  .app.customer .msg.agent .body{border-left-color:#39e0b0;}
  .app.customer .msg .tag{color:#0b5f4d; text-shadow:0 1px 5px rgba(255,255,255,.55);}
  .app.customer .msg.user .tag{color:#0b4a5f;}
  .app.customer .sys{color:#0b5f4d; background:rgba(255,255,255,.72);}
  .app.customer .send{border-color:#39e0b0; color:#0b5f4d;}
  .app.customer .send:hover{background:rgba(57,224,176,.18); box-shadow:0 0 12px rgba(57,224,176,.3);}
  .app.customer .dot{background:#39e0b0; box-shadow:0 0 6px #39e0b0;}
  .app.customer .statsHead .chev, .app.customer .stat.open .chev{color:#39e0b0;}
  .flow{
    mix-blend-mode:soft-light; opacity:.55;
    animation:driftB 54s ease-in-out infinite alternate;
  }
  .gloss{
    mix-blend-mode:screen; opacity:.16; filter:blur(14px);
    transform:scaleX(-1);
    animation:driftC 76s ease-in-out infinite alternate;
  }
  .gloss2{display:none;}
  @keyframes drift{
    0%{transform:scale(1.02) translate3d(0,0,0);}
    100%{transform:scale(1.12) translate3d(-3%,-4%,0);}
  }
  @keyframes driftB{
    0%{transform:scale(1.14) rotate(2deg) translate3d(2%,3%,0);}
    100%{transform:scale(1.02) rotate(-2deg) translate3d(-3%,-2%,0);}
  }
  @keyframes driftC{
    0%{transform:scaleX(-1) scale(1.2) translate3d(-3%,2%,0);}
    100%{transform:scaleX(-1) scale(1.05) translate3d(3%,-4%,0);}
  }
  .app{
    position:relative; z-index:1; overflow:hidden;
    width:100%; max-width:520px; height:100dvh;
    display:flex; flex-direction:column;
    background:#0a0d14;
    border-left:1px solid rgba(255,34,51,.35);
    border-right:1px solid rgba(255,34,51,.35);
  }
  .app > header, .app > .modes, .app > .stats, .app > .log, .app > .composer{position:relative; z-index:1;}
  .veil{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(125% 95% at 50% 42%, rgba(0,0,0,.10), rgba(0,0,0,.34));
  }

  header{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line-hot);
    background:#000;
    position:relative; flex:0 0 auto;
  }
  header::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
    opacity:.55;
  }

  .avatar{
    position:relative; width:46px; height:46px; flex:0 0 auto;
    border-radius:50%; border:1px solid var(--line-hot);
    display:grid; place-items:center; overflow:hidden;
    background:#000;
  }
  .avatar::before{
    content:''; position:absolute; inset:-2px; border-radius:50%;
    box-shadow:0 0 14px 1px rgba(255,34,51,.28); pointer-events:none;
  }
  .avatar canvas{width:100%;height:100%;display:block;filter:url(#avatarWarp);}

  .who{flex:1 1 auto; min-width:0;}
  .who h1{
    margin:0; font-size:13px; font-weight:500; letter-spacing:.14em;
    text-transform:uppercase; color:var(--txt);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .who p{
    margin:3px 0 0; font-size:10.5px; letter-spacing:.08em;
    color:var(--txt-dim); display:flex; align-items:center; gap:6px;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--red);
       box-shadow:0 0 6px var(--red); animation:blink 2.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .modes{
    flex:0 0 auto; display:flex; gap:7px;
    overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; background:#000;
    padding:9px 14px; border-bottom:1px solid var(--line);
    mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent 100%);
  }
  .modes::-webkit-scrollbar{display:none;}
  .tokenchip{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    padding:7px 12px; border-radius:3px; white-space:nowrap;
    border:1px solid var(--line-hot); background:rgba(0,0,0,.55);
    font-family:inherit; font-size:9px; letter-spacing:.09em;
    color:var(--txt-dim); font-variant-numeric:tabular-nums;
    cursor:default; user-select:none; margin-left:2px;
    transition:border-color .3s, color .3s;
  }
  .tokenchip .num{color:#fff; font-weight:500;}
  .tokenchip .bar{
    width:34px; height:3px; border-radius:2px; background:#1c1c1c; overflow:hidden;
  }
  .tokenchip .bar i{
    display:block; height:100%; width:100%; border-radius:2px;
    background:linear-gradient(90deg,#7a0f18,#ff2233);
    transition:width .8s cubic-bezier(.22,.9,.25,1), background .3s;
  }
  .tokenchip.warn{border-color:#c8891a; color:#e8b455;}
  .tokenchip.warn .bar i{background:linear-gradient(90deg,#7a4a08,#ffb02e);}
  .tokenchip.crit{border-color:#ff2233; color:#ff6d78;}
  .tokenchip.crit .bar i{background:linear-gradient(90deg,#8c0d16,#ff2233);}
  .tokenchip.crit .num{color:#ff6d78;}
  .modebtn{
    flex:0 0 auto; cursor:pointer; user-select:none;
    font-family:inherit; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; padding:7px 12px; white-space:nowrap; flex:0 0 auto;
    color:var(--txt-dim); background:transparent;
    border:1px solid var(--line-hot); border-radius:3px;
    transition:color .2s, border-color .2s, background .2s, box-shadow .2s;
  }
  .modebtn:hover{color:var(--txt); border-color:var(--red-dim);}
  #btnInvestor.on{
    color:#fff; border-color:var(--red); background:rgba(255,34,51,.12);
    box-shadow:0 0 12px rgba(255,34,51,.3), inset 0 0 10px rgba(255,34,51,.07);
  }
  #btnCustomer.on{
    color:#fff; border-color:#39e0b0; background:rgba(57,224,176,.12);
    box-shadow:0 0 12px rgba(57,224,176,.3), inset 0 0 10px rgba(57,224,176,.07);
  }
  #btnOrb.on{
    color:#fff; border-color:#c9a8ff; background:rgba(201,168,255,.12);
    box-shadow:0 0 12px rgba(201,168,255,.28), inset 0 0 10px rgba(201,168,255,.07);
  }
  #btnBusiness.on{
    color:#fff; border-color:#e0b23c; background:rgba(224,178,60,.14);
    box-shadow:0 0 12px rgba(224,178,60,.3), inset 0 0 10px rgba(224,178,60,.07);
  }
  #btnFinancial.on{
    color:#fff; border-color:#a8e33a; background:rgba(168,227,58,.14);
    box-shadow:0 0 12px rgba(168,227,58,.3), inset 0 0 10px rgba(168,227,58,.07);
  }
  #btnCampaign.on{
    color:#fff; border-color:#ff8c3a; background:rgba(255,140,58,.14);
    box-shadow:0 0 12px rgba(255,140,58,.3), inset 0 0 10px rgba(255,140,58,.07);
  }
  .modebtn:disabled{opacity:.45; cursor:default;}

  .stats{
    flex:0 0 auto; background:#000; border-bottom:1px solid var(--line);
  }
  .statsHead{
    display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
    padding:11px 16px;
  }
  .statsHead .lbl{
    font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:#fff;
  }
  .statsHead .peek{
    flex:1 1 auto; font-size:10px; letter-spacing:.08em; color:var(--txt-dim);
    font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; transition:opacity .25s;
  }
  .statsHead .chev{
    font-size:9px; color:var(--red); transition:transform .32s cubic-bezier(.3,.9,.3,1);
  }
  .stats.open .statsHead .chev{transform:rotate(180deg);}
  .stats.open .statsHead .peek{opacity:0;}

  .drawer{
    max-height:0; overflow:hidden;
    transition:max-height .42s cubic-bezier(.3,.9,.3,1);
  }
  .stats.open > .drawer{max-height:1100px;}

  .stat{
    border-top:1px solid #141414; padding:10px 16px 12px;
  }
  .stat .row{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    cursor:pointer; user-select:none;
  }
  .stat .k{
    font-size:8.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--txt-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stat .right{display:flex; align-items:baseline; gap:7px; flex:0 0 auto;}
  .stat .v{font-size:11px; font-weight:500; color:#fff; font-variant-numeric:tabular-nums;}
  .stat .chev{font-size:8px; color:var(--red-dim); transition:transform .32s cubic-bezier(.3,.9,.3,1);}
  .stat.open .chev{transform:rotate(180deg); color:var(--red);}
  .stat .track{
    margin-top:6px; height:3px; border-radius:2px; background:#1c1c1c; overflow:hidden;
  }
  .stat .fill{
    height:100%; width:0%; border-radius:2px;
    background:linear-gradient(90deg,#7a0f18,#ff2233);
    box-shadow:0 0 8px rgba(255,34,51,.55);
    transition:width 1.1s cubic-bezier(.22,.9,.25,1);
  }
  .stat.vision .fill{background:linear-gradient(90deg,#5c0b12,#ff5f6d);}
  .stat .v.bump{animation:bump .5s ease;}
  @keyframes bump{0%{transform:translateY(-2px);opacity:.4}100%{transform:none;opacity:1}}

  .graph{max-height:0; overflow:hidden; transition:max-height .42s cubic-bezier(.3,.9,.3,1);}
  .stat.open .graph{max-height:180px;}
  .graph .inner{padding:12px 0 2px;}
  .graph svg{display:block; width:100%; height:66px;}
  .graph .cap{
    display:flex; justify-content:space-between; margin-top:6px;
    font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:#5c5656;
  }
  .graph .empty{
    font-size:10px; color:#5c5656; letter-spacing:.08em; padding:14px 0 6px;
  }
  .stats-detail{border-top:1px solid #141414;padding:10px 16px 13px;}
  .stats-detail h3{margin:0 0 8px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim);}
  .slot-list,.stage-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
  .slot-item,.stage-item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;color:#aaa;}
  .slot-item .score,.stage-item .state{font-variant-numeric:tabular-nums;color:#fff;}
  .stage-item.done .state{color:#7fe6bc;}
  .thinnest-note,.no-readings{margin-top:8px;font-size:9px;color:#817979;letter-spacing:.04em;}
  .log{
    flex:1 1 auto; overflow-y:auto; padding:18px 16px 8px;
    display:flex; flex-direction:column; gap:14px;
    scrollbar-width:thin; scrollbar-color:var(--line-hot) transparent;
  }
  .log::-webkit-scrollbar{width:5px;}
  .log::-webkit-scrollbar-thumb{background:var(--line-hot);border-radius:3px;}

  .msg{max-width:86%; font-size:13px; line-height:1.65; white-space:pre-wrap;
       word-wrap:break-word; animation:rise .28s ease-out;}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .tag{display:block; font-size:9.5px; letter-spacing:.16em;
            text-transform:uppercase; margin-bottom:5px; color:#ff5f6d;
            text-shadow:0 1px 6px rgba(0,0,0,.9);}
  .msg .body{padding:10px 13px; border-radius:3px; background:#000;
             box-shadow:0 2px 14px rgba(0,0,0,.7);}

  .agent{align-self:flex-start;}
  .agent .body{border-left:2px solid var(--red); border-top:1px solid var(--line);
               border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
  .user{align-self:flex-end; text-align:left;}
  .user .tag{color:#e9e9e9; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.9);}
  .user .body{border:1px solid var(--line-hot); background:#000; color:#fff;}

  .sys{align-self:center; max-width:100%; font-size:10px; letter-spacing:.14em;
       text-transform:uppercase; color:#ff5566; padding:3px 10px;
       background:rgba(0,0,0,.6); border-radius:3px;}

  .typing{display:inline-flex; gap:4px; padding:2px 0;}
  .typing i{width:4px;height:4px;border-radius:50%;background:var(--red-dim);
            animation:bounce 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .composer{
    flex:0 0 auto; display:flex; align-items:flex-end; gap:9px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line-hot); position:relative;
    background:rgba(0,0,0,.55); backdrop-filter:blur(14px);
  }
  .composer::before{
    content:''; position:absolute; left:0; right:0; top:-1px; height:1px;
    background:linear-gradient(90deg,transparent,var(--red),transparent); opacity:.4;
  }
  textarea{
    flex:1 1 auto; resize:none; max-height:110px; min-height:40px;
    font-family:inherit; font-size:13px; line-height:1.5; color:var(--txt);
    background:#000; border:1px solid var(--line-hot); border-radius:3px;
    padding:11px 12px; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  textarea::placeholder{color:#6a6a6a;}
  textarea:focus{border-color:var(--red-dim); box-shadow:0 0 0 1px rgba(255,34,51,.18);}
  .send{
    flex:0 0 auto; width:40px; height:40px; cursor:pointer;
    background:transparent; border:1px solid var(--red-dim); border-radius:3px;
    color:var(--red); font-size:15px; line-height:1;
    display:grid; place-items:center; transition:background .18s, box-shadow .18s;
  }
  .send:hover{background:rgba(255,34,51,.12); box-shadow:0 0 12px rgba(255,34,51,.25);}
  .send:active{transform:scale(.95);}

  .close-ui{margin-left:auto;align-self:flex-start;background:transparent;border:1px solid var(--line-hot);color:var(--txt-dim);border-radius:3px;padding:5px 9px;cursor:pointer;font:inherit}
  .close-ui:hover{color:var(--txt);border-color:var(--red)}
  .campaign-upload-btn{flex:0 0 auto;background:transparent;border:1px solid var(--line-hot);color:var(--txt-dim);border-radius:3px;padding:8px;cursor:pointer;font:inherit;font-size:11px}
  .campaign-upload-btn[hidden]{display:none}
  .message-actions{display:flex;gap:6px;margin:6px 0 0 24px}
  .export-btn{background:transparent;border:1px solid var(--line-hot);color:var(--txt-dim);border-radius:3px;padding:4px 7px;cursor:pointer;font:inherit;font-size:10px}
  .export-btn:hover{color:var(--txt);border-color:var(--red-dim)}
  .modal-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-overlay[hidden]{display:none}
  .upload-modal{width:min(100%,480px);max-height:90dvh;overflow:auto;background:#0a0d14;border:1px solid var(--line-hot);padding:18px;display:grid;gap:12px;color:var(--txt)}
  .upload-modal h2{font-size:14px;margin:0}
  .upload-field{display:grid;gap:5px;font-size:11px;color:var(--txt-dim)}
  .upload-field textarea{width:100%;min-height:56px;resize:vertical}
  .upload-field input{font:inherit;color:var(--txt-dim)}
  .upload-status{min-height:16px;color:#ff8c3a;font-size:11px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px}
  .modal-actions button,.close-overlay button{font:inherit;font-size:11px;padding:8px 12px;background:#0a0d14;color:var(--txt);border:1px solid var(--line-hot);cursor:pointer}
  .modal-actions .primary{border-color:var(--red);color:var(--red)}
  .close-overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#05070c;color:var(--txt);text-align:center;padding:24px}
  .close-overlay.visible{display:flex}
  .close-overlay h2{font-size:16px;margin:0}
  .close-overlay p{font-size:12px;color:var(--txt-dim)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="avatarWarp" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div class="app">
  <div class="aurora"></div>
  <div class="aurora-r"></div>
  <div class="aurora-c"></div>
  <div class="aurora-b"></div>
  <div class="aurora-k"></div>

  <div class="flow-f"></div>

  <div class="gloss-c"></div>
  <div class="gloss-b"></div>
  <div class="gloss-k"></div>
  <div class="gloss-f"></div>
  <header>
    <div class="avatar"><canvas id="av" width="132" height="132"></canvas></div>
    <div class="who">
      <h1 id="agentName">Nova</h1>

  <div class="modes" id="modes">
    <button class="modebtn" id="btnOrb" data-persona="orb" aria-pressed="false">General</button>

    <button class="modebtn" id="btnCampaign" data-persona="campaign">Campaign Builder</button>
    <button class="modebtn" id="btnFinancial" data-persona="financial">Financial</button>
    <div class="tokenchip" id="tokenChip" title="Token budget for this window">
      <span class="bar"><i id="tokBar"></i></span>
      <span><span class="num" id="tokLeft">—</span> / <span id="tokLimit">—</span> tokens left</span>
      <span>&middot; resets <span id="tokReset">--:--</span></span>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="statsHead" id="statsHead">
      <span class="lbl">Stats</span>
      <span class="peek" id="peek">0% understood &middot; 0% vision</span>
      <span class="chev">&#9660;</span>
    </div>
    <div class="drawer">
      <div class="stat understanding" id="statU">
        <div class="row" data-stat="u">
          <span class="k">Startup understood</span>
          <span class="right"><span class="v" id="uVal">0%</span><span class="chev">&#9660;</span></span>
        </div>
        <div class="track"><div class="fill" id="uFill"></div></div>
        <div class="graph"><div class="inner" id="uGraph"></div></div>
      </div>
      <div class="stat vision" id="statV">
        <div class="row" data-stat="v">
          <span class="k">Vision accomplished</span>
          <span class="right"><span class="v" id="vVal">0%</span><span class="chev">&#9660;</span></span>
        </div>
        <div class="track"><div class="fill" id="vFill"></div></div>
        <div class="graph"><div class="inner" id="vGraph"></div></div>
      </div>
      <div class="stats-detail">
        <h3>Startup slots</h3>
        <div class="slot-list" id="slotList"></div>
        <div class="thinnest-note" id="thinnestNote">No readings yet</div>
      </div>
      <div class="stats-detail">
        <h3>Vision ladder</h3>
        <div class="stage-list" id="stageList"></div>
      </div>
    </div>
  </div>

  <div class="log" id="log"></div>

  <div class="composer">
    <button class="campaign-upload-btn" id="campaignUploadBtn" type="button" hidden>Upload Inputs</button>
    <textarea id="input" rows="1" placeholder="Message…"></textarea>
    <button class="send" id="send" aria-label="Send">&#9654;</button>
  </div>
</div>

<div class="modal-overlay" id="campaignUploadModal" hidden>
  <div class="upload-modal" role="dialog" aria-modal="true" aria-labelledby="campaignUploadTitle">
    <h2 id="campaignUploadTitle">Campaign Inputs</h2>
    <div class="upload-field"><label for="campaignBusinessModel">Business Model</label><textarea id="campaignBusinessModel"></textarea></div>
    <div class="upload-field"><label for="campaignTargetUsers">Target Users</label><textarea id="campaignTargetUsers"></textarea></div>
    <div class="upload-field"><label for="campaignDemographics">Demographics</label><textarea id="campaignDemographics"></textarea></div>
    <div class="upload-field"><label for="campaignFinancialPlan">Financial Plan</label><textarea id="campaignFinancialPlan"></textarea></div>
    <div class="upload-field"><label for="campaignUploadFile">Optional .md, .txt, or .docx</label><input id="campaignUploadFile" type="file" accept=".md,.txt,.docx"></div>
    <div class="upload-status" id="campaignUploadStatus"></div>
    <div class="modal-actions"><button type="button" id="campaignUploadCancel">Cancel</button><button type="button" class="primary" id="campaignUploadSubmit">Submit</button></div>
  </div>
</div>
<div class="close-overlay" id="closeOverlay" aria-hidden="true">
  <h2>Session Ended</h2><p>Your conversation has been cleared.</p><button type="button" id="reopenBtn">Reopen Jeff</button>
</div>
