
services:
  postgres:
    image: postgres:16
    container_name: jeff-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: jeff
      POSTGRES_PASSWORD: jeffpassword
      POSTGRES_DB: jeffdb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: